name: Deploy V3 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve source HTML entry
        run: |
          if [ ! -f app.html ]; then
            cp index.html app.html
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate
        run: |
          npm run typecheck
          npm test

      - name: Build Vite site
        run: npm run build

      - name: Prepare legacy Pages root
        run: |
          cp dist/app.html dist/index.html
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html

      - name: Commit compiled Pages files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html index.html assets
          if git diff --cached --quiet; then
            echo "Compiled Pages root already current"
          else
            git commit -m "Publish compiled Pages build [skip ci]"
            git push
          fi

      - name: Request legacy Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
